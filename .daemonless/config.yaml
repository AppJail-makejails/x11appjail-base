build:
  variants:
    - tag: 15.1-x11
      containerfile: Containerfile.x11
      aliases: ["latest"]
      default: true
      args:
        FREEBSD_RELEASE: "15.1"
        NO_PKGCLEAN: "1"
        PORTS_GIT: "https://gitlab.com/FreeBSD/FreeBSD-ports.git"
      cache_dirs: ["pkgcache0:/var/cache/pkg"]
    - tag: 15.1-nox11
      containerfile: Containerfile.nox11
      args:
        FREEBSD_RELEASE: "15.1"
        NO_PKGCLEAN: "1"
      cache_dirs: ["pkgcache0:/var/cache/pkg"]
